services:
  api:
    build: .
    container_name: mytripcircle_api
    env_file:
      - .env
    # `deploy.restart_policy` n'est honoré qu'en mode Swarm : hors Swarm, Compose
    # l'ignore silencieusement et le conteneur ne redémarre jamais. La politique
    # est donc déclarée au niveau du service, où elle s'applique réellement.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - network_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.mytripcircle-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.mytripcircle-api-fr.rule=Host(`api.mytripcircle.fr`)"
      - "traefik.http.routers.mytripcircle-api-fr.entrypoints=websecure"
      - "traefik.http.routers.mytripcircle-api-fr.tls.certresolver=default"
      - "traefik.http.routers.mytripcircle-api-fr.service=mytripcircle-api"

networks:
  network_web:
    external: true
