sonar.projectKey=MyTripCircle_MyTripCircle-API
sonar.organization=mytripcircle

# Encodage des sources, sinon le scanner retombe sur celui de la plateforme.
sonar.sourceEncoding=UTF-8

# Périmètre analysé : tout le dépôt, moins les dépendances installées et le
# rapport HTML de couverture, présents sur le disque du runner pendant la CI.
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**

# `sonar.tests` désigne la même racine que `sonar.sources` : pointé vers un
# sous-répertoire, il ferait considérer tout ce répertoire comme du code de test
# et l'écarterait de l'analyse (défaut constaté sur le client mobile le 16/08).
sonar.tests=.
sonar.test.inclusions=**/__tests__/**/*.test.js

# Couverture : rapport LCOV produit par `npm run test:coverage` dans la CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Miroir des omissions de `collectCoverageFrom` dans jest.config.js : tout
# écart ferait diverger le pourcentage de SonarCloud de celui mesuré en local.
sonar.coverage.exclusions=**/__tests__/**,jest.config.js,coverage/**,index.js,db.js

# Attendre le verdict de la porte qualité et faire échouer l'étape si elle ne
# passe pas : combinée à la règle de branche, une porte en échec bloque alors la
# fusion au lieu d'être seulement affichée sur le tableau de bord.
sonar.qualitygate.wait=true
